# XcodeGen spec. From this directory:
#
#     brew install xcodegen
#     xcodegen generate
#     open AudiobookReader.xcodeproj
#
# `AudiobookReader.xcodeproj` and the generated `Info.plist` are build products:
# regenerate them rather than editing them.

name: AudiobookReader

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AudiobookReader:
    type: application
    platform: iOS
    sources:
      - path: AudiobookReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AudiobookReader
        PRODUCT_NAME: Audiobook Reader
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
    info:
      path: AudiobookReader/Info.plist
      properties:
        CFBundleDisplayName: Audiobook Reader
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""

        # Keeps narration running with the screen locked. Without this the app
        # behaves exactly like the web version it replaces: it stops talking the
        # moment the display goes off. `AudioSessionController` does the other
        # half of the job by putting the session into `.playback`.
        UIBackgroundModes:
          - audio

        # Open a PDF from Files, Mail or another app's share sheet.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  AudiobookReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AudiobookReaderTests
    dependencies:
      - target: AudiobookReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AudiobookReaderTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AudiobookReader:
    build:
      targets:
        AudiobookReader: all
        AudiobookReaderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AudiobookReaderTests
